<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Predictive Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-red-600 to-orange-500 min-h-screen flex items-center justify-center font-sans antialiased">

  <div class="bg-black shadow-xl rounded-3xl overflow-hidden flex w-[90%] max-w-6xl mx-auto">
    
    <!-- Left Panel -->
    <div class="hidden lg:flex flex-col justify-center items-center bg-cover bg-center bg-no-repeat w-1/2 p-10 text-white bg-[url('https://images.unsplash.com/photo-1605902711622-cfb43c4437d1?auto=format&fit=crop&w=800&q=80')]">
      <div class="backdrop-blur-sm bg-black/60 p-6 rounded-xl">
        <h1 class="text-4xl font-bold mb-4 drop-shadow-lg">Predictive Analytics</h1>
        <p class="text-lg leading-relaxed drop-shadow-lg max-w-sm">
          Empower your construction projects with AI-powered insights for smarter planning and efficient execution.
        </p>
      </div>
    </div>

    <!-- Right Panel (Login Form) -->
    <div class="w-full lg:w-1/2 p-10">
      <h2 class="text-3xl font-bold text-white mb-6 text-center">Welcome Back</h2>
      <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-200 mb-1">Email</label>
          <input type="email" name="email" required 
            class="w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-200 mb-1">Password</label>
          <input type="password" name="password" required 
            class="w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>
        <button type="submit"
          class="w-full bg-red-600 hover:bg-red-700 transition text-white font-semibold py-2 rounded-lg shadow">
          Sign In
        </button>
      </form>
      <p class="mt-6 text-center text-sm text-gray-400">
        Don’t have an account? <a href="{{ url_for('register') }}" class="text-orange-500 font-medium hover:underline">Sign up</a>
      </p>
    </div>

  </div>
</body>
</html>
